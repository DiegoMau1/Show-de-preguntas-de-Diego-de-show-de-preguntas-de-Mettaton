    const quizContent = document.getElementById('quiz-content');
    const startBtn = document.getElementById('start-btn');

    // El evento de clic en este botón es el que "autoriza" al navegador a usar audio
    startBtn.onclick = () => {
        startScreen.style.display = 'none'; // Oculta inicio
        quizContent.style.display = 'block'; // Muestra el quiz
        
        bgMusic.play().catch(e => console.error("Error al reproducir:", e));
        loadQuestion(); // Inicia la primera pregunta
    };
    
    // Función para manejar el inicio seguro (por políticas de autoplay)
    function playSafe() {
        bgMusic.play().catch(error => {
            console.log("El navegador bloqueó el autoplay. Esperando interacción...");
        });
    }

    let currentQuestion = 0;
    let score = 0;

    const questionText = document.getElementById('question-text');
    const optionsContainer = document.getElementById('options-container');
    const progress = document.getElementById('progress');
    const resultsDiv = document.getElementById('results');

    function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

    function loadQuestion() {
    if (currentQuestion === 0) {
        playSafe(); // Inicia la música en la primera pregunta
    }
    const q = quizData[currentQuestion];
    
    // --- Lógica de Mezcla ---
    const respuestaCorrectaTexto = q.a[q.c]; // Guardamos el texto de la respuesta correcta
    shuffle(q.a); // Mezclamos el array de respuestas original
    q.c = q.a.indexOf(respuestaCorrectaTexto); // Actualizamos el índice 'c' a la nueva posición
    // ------------------------

    questionText.innerText = `${currentQuestion + 1}. ${q.q}`;
    optionsContainer.innerHTML = '';
    
    q.a.forEach((opt, index) => {
        const btn = document.createElement('div');
        btn.className = 'option';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index);
        optionsContainer.appendChild(btn);
    });

    progress.style.width = `${((currentQuestion) / quizData.length) * 100}%`;
    }
    
    function checkAnswer(selected) {
    const q = quizData[currentQuestion];
    const correct = q.c;
    
    // NUEVO: Guardamos lo que eligió el usuario para mostrarlo al final
    q.userChoice = selected; 

    const options = document.querySelectorAll('.option');
    options.forEach(opt => opt.style.pointerEvents = 'none');

    if(selected === correct) {
        options[selected].classList.add('correct');
        score++;
    } else {
        options[selected].classList.add('incorrect');
        options[correct].classList.add('correct');
    }

    setTimeout(() => {
        currentQuestion++;
        if(currentQuestion < quizData.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }, 1000);
}

        setTimeout(() => {
            currentQuestion++;
            if(currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }, 1000);
    

    function showResults() {
        bgMusic.pause();          // Detiene la música
        bgMusic.currentTime = 0;  // Reinicia el track al segundo 0
    
        quizContent.style.display = 'none';
        resultsDiv.style.display = 'block';
        quizContent.style.display = 'none';
        resultsDiv.style.display = 'block';
        document.getElementById('score-text').innerText = `Has obtenido ${score} de ${quizData.length} puntos.`;
    
    const reviewList = document.getElementById('review-list');
    reviewList.innerHTML = '<h3>Revisión de intentos:</h3>';

    quizData.forEach((q, index) => {
        const isCorrect = q.userChoice === q.c;
        const item = document.createElement('div');
        item.className = 'review-item';
        item.innerHTML = `
            <span class="review-q">${index + 1}. ${q.q}</span>
            <span class="review-a ${isCorrect ? 'txt-correct' : 'txt-incorrect'}">
                <span class="txt-label">Tu respuesta:</span> ${q.a[q.userChoice] || 'No respondida'}
            </span>
            ${!isCorrect ? `<span class="review-a txt-correct"><span class="txt-label">Correcta:</span> ${q.a[q.c]}</span>` : ''}
        `;
        reviewList.appendChild(item);
    });

    const rank = (score / quizData.length) > 0.8 ? "Estas listo para la presentación." : (score / quizData.length > 0.5 ? "Estas casi listo para la presentación, falta mejorar algunos aspectos." : "Considera esudiar mas el sistema.");
    document.getElementById('feedback').innerHTML = `<h3>Resultado: ${rank}</h3>`;
}

    function restartQuiz() {
        currentQuestion = 0;
        score = 0;
        // Limpiamos las elecciones previas
        quizData.forEach(q => delete q.userChoice);
        
        // Mezclamos de nuevo para que no sea igual
        shuffle(quizData); 
        
        // Reset UI
        resultsDiv.style.display = 'none';
        quizContent.style.display = 'block';
        bgMusic.currentTime = 0;
        bgMusic.play();
        loadQuestion();
    }
    
    
    shuffle(quizData);
</script>
